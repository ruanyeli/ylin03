    <script>
      // Assets use relative paths, so a sub-path URL without a trailing slash
      // (e.g. behind a proxy at /.../8080) would resolve them one level too high.
      (function () {
        var path = location.pathname
        var last = path.slice(path.lastIndexOf('/') + 1)
        if (last && last.indexOf('.') === -1) location.replace(path + '/' + location.search + location.hash)
      })()
    </script>

  </body>
